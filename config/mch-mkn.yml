# MKN source and processing configuration.
root: /product_data/data/pay/Kenya/MKN/
logging: mch-mkn.log
branches:
  incoming: incoming
  archive: archive
  issues: incoming_with_issues
  logs: logs
folders:
  - ae33
  - fidas
  - meteo
  - 49c
  - 49i
  - g2401
  - ne300
  - hmp110-ae33
  - hmp110-inlet
  - avo
  # TAHMO filenames have mrids rather than dates; do not pass to date organizer.
ae33:
  pattern: ae33-\d{12}.(zip|dat)
  buckets: daily
  split_parquet: month
  expected: 144
fidas:
  pattern: fidas-\d{10}.parquet
  buckets: daily
  split_parquet: month
  expected: 24
meteo:
  pattern: VRXA00.\d{12}
  buckets: daily
  split_parquet: month
  expected: 144
49c:
  pattern: (?i)^49c-\d{10}\.(zip|dat)$
  buckets: daily
  split_parquet: month
  expected: 24
49i:
  pattern: (?i)^49i-\d{10}\.(zip|dat)$
  buckets: daily
  split_parquet: month
  expected: 24
g2401:
  pattern: CFKADS2320-\d{8}-\d{6}Z-DataLog_User_Sync.zip
  buckets: daily
  split_parquet: month
  expected: 24
ne300:
  pattern: ne300-\d{12}.(zip|dat)
  buckets: daily
  split_parquet: month
  expected: 144
hmp110-ae33:
  pattern: hmp110-ae33-\d{10}.(zip|dat)
  buckets: daily
  split_parquet: month
  expected: 24
hmp110-inlet:
  pattern: hmp110-inlet-\d{10}.(zip|dat)
  buckets: daily
  split_parquet: month
  expected: 24
avo:
  pattern: (?i)^mt_kenya_g_a_w_met_station_avo_(instant|hourly|daily|weekly|monthly|yearly|annual)-\d{6,8}\.(parquet|zip|csv|txt)$
  split_parquet: month
  read_archive: false

tahmo:
  device_sn: z6-02149
  split_parquet: month
  # Values remain in their native TAHMO units (see docs/data_variables.md).
  variables:
    Air Temperature: air_temperature
    Atmospheric Pressure: atmospheric_pressure
    Battery Percent: battery_percent
    Battery Voltage: battery_voltage
    Gust Speed: gust_speed
    Lightning Activity: lightning_activity
    Lightning Distance: lightning_distance
    Logger Temperature: logger_temperature
    Max Precip Rate: max_precip_rate
    Precipitation: precipitation_amount
    RH Sensor Temp: rh_sensor_temp
    Reference Pressure: reference_pressure
    Solar Radiation: solar_radiation
    VPD: vpd
    Vapor Pressure: vapor_pressure
    Wind Direction: wind_direction
    Wind Speed: wind_speed
    X-axis Level: x_axis_level
    Y-axis Level: y_axis_level

level2:
  station: mkn
  datetime_column: dtm
  timezone: UTC
  valid_flag_value: 0
  accept_null_flags: true
  parquet_compression: zstd
  output:
    hourly: true
    daily: true
  flags:
    mode: per_column_prefix
    prefix: f_
  aggregation:
    hourly:
      default: mean
      every: 1h
      label: left
      closed: left
    daily:
      default: mean
      every: 1d
      label: left
      closed: left
  instruments:
    tei49c:
      columns:
        - o3
    tei49i:
      columns:
        - o3
        - flowa
        - flowb
        - pres
    ae33:
      source_parquet: ae33
      columns:
        - BC1
        - BC2
        - BC3
        - BC4
        - BC5
        - BC6
        - BC7
        - b1_abs
        - b2_abs
        - b3_abs
        - b4_abs
        - b5_abs
        - b6_abs
        - b7_abs
        - Pressure
        - Temperature
      reporting_condition_correction:
        pressure_column: Pressure
        temperature_column: Temperature
        target_pressure_pa: 101325
        target_temperature_c: 0.0
        columns:
          - BC1
          - BC2
          - BC3
          - BC4
          - BC5
          - BC6
          - BC7
          - b1_abs
          - b2_abs
          - b3_abs
          - b4_abs
          - b5_abs
          - b6_abs
          - b7_abs
    fidas:
      columns:
        - "60"
        - "61"
        - "62"
        - "63"
        - "64"

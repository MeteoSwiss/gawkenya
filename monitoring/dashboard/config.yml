dashboard:
  title: GAW Kenya data dashboard
  subtitle: Current Level-1 parquet files
  level: level1
  timezone: UTC
  max_plot_points: 3000
  cadence_sample_rows: 10000
  source_repository: MeteoSwiss/gawkenyadata
  # Saved per-variable quality flags follow the ez_flag_data.py convention.
  flag_prefix: f_

  # The Level-1 writer normally uses dtm. The remaining names are fallbacks
  # for older or externally produced parquet files.
  default_time_columns:
    - dtm
    - timestamp
    - datetime

  # Numeric housekeeping / QA columns matching these expressions are not
  # treated as observation variables unless explicitly selected below.
  exclude_columns:
    - '(?i)^f_'
    - '(?i)^flags?$'
    - '(?i)^row_?id$'
    - '(?i)^id$'
    - '(?i)^checksum$'
    - '(?i)^status$'
    - '(?i)^serial(_?number)?$'
    - '(?i)^year$'
    - '(?i)^month$'
    - '(?i)^day$'

stations:
  mkn:
    label: MKN
  nrb:
    label: NRB
  buc:
    label: BUC

# Optional source-specific overrides. Keys can be a file stem (all stations),
# a source id relative to the YYYY/MM directory, or <station>/<source-id> for
# the most specific override.
#
# plot_variables controls which variables are exported to the public JSON and
# offered in the plot selector. table_variables controls which variables get a
# row in the summary table. If both are omitted, all automatically detected
# numeric observation variables are used for both.
#
# The older `variables:` key is retained as a shorthand meaning "use this list
# for both plot_variables and table_variables".
#
# A cadence override is dashboard-specific. It is strongly recommended for
# operational sources with a known nominal sampling interval. Without it the
# cadence is inferred from the median positive interval of the latest sample.
source_overrides: {}

# Examples:
# source_overrides:
#   ae33:
#     cadence: 1m
#     time_column: dtm
#     plot_variables: [BC1, BC2, BC3, BC4, BC5, BC6]
#     table_variables: [BC6]
#
#   mkn/tei49i:
#     cadence: 1m
#     plot_variables: [o3, sample_flow, pressure]
#     table_variables: [o3]
#
#   nrb/diagnostic-source:
#     publish: false
#
#   some-source:
#     exclude_columns:
#       - '(?i)^diagnostic_'
  mkn/ae33:
    cadence: 1m
    time_column: dtm
    plot_variables: [BC1, BC2, BC3, BC4, BC5, BC6]
    table_variables: [BC6]

  mkn/tei49c:
    cadence: 1m
    plot_variables: [o3, cellai, cellbi, flowa, flowb, flags]
    table_variables: [o3]

  tei49i:
    cadence: 1m
    plot_variables: [o3, cellai, cellbi, flowa, flowb, flags]
    table_variables: [o3]

  fidas:
    cadence: 1m
    plot_variables: [60, 61, 62, 63, 64, 65]
    table_variables: [60]

  mkn/g2401:
    cadence: 1m
    plot_variables: [CO2_dry_sync, CH4_dry_sync, CO_sync, CavityPressure, CavityTemp, DasTemp, EtalonTemp, WarmBoxTemp, MPVPosition]
    table_variables: [CO_sync, CH4_dry_sync]

  mkn/ne300:
    cadence: 1m
    plot_variables: [2525000, 2525090, 5002]
    table_variables: [2525000]

  nrb/ae31:
    cadence: 1m
    plot_variables: [UV370, IR880, IR950]
    table_variables: [IR880]
  
  nrb/aurora3000:
    cadence: 1m
    plot_variables: [ssp1, ssp2, ssp3, sbsp1, sbsp2, sbsp3, pressure, major_state]
    table_variables: [ssp1
  

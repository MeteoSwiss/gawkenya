nrb-brewer:
  root: /product_data/data/pay/ozone/arosa
  logging: mch-nrb.log
  branches:
    incoming: incoming
  folders:
    - "071"
  "071": 
    pattern: B\d{5}.071
    buckets: None
    expected: 1

nrb-dobson:
  root: /product_data/data/pay/Kenya
  logging: mch-nrb.log
  branches:
    uploads: uploads
  file_name: file_coverage_D018.json
  folders:
    - "prod"
  "prod": 
    pattern: D\d{7}.018
    buckets: yearly
    expected: 260

nrb-aq:
  root: /product_data/data/pay/Kenya/NRB
  logging: mch-nrb.log
  branches:
    incoming: incoming
    archive: archive
    issues: incoming_with_issues
    logs: logs    
  file_name: file_coverage_nrb_aq.json
  folders:
    - "49i"
    - ae31
    - aurora3000
    - avo
    - fidas
    - hmp110-ae31
    - hmp110-inlet
    - hmp110-lab
  "49i": 
    pattern: 49i-\d{12}.(zip|dat)
    header: pcdate pctime time date flags o3 hio3 cellai cellbi bncht lmpt o3lt flowa flowb pres
    buckets: daily
    split_parquet: month    
    expected: 24
  ae31:
    pattern: (?i)ae31[_-]\d{10}\.(csv|zip)  # (ae31-\d{10}.(zip|csv))|(AE31_\d{10}\.csv)
    buckets: daily
    split_parquet: month    
    expected: 24
  aurora3000:
    pattern: aurora3000-\d{10}.(zip|csv)
    buckets: daily
    split_parquet: month
    expected: 24
  avo:
    pattern: (?i)^kmd_hq_nairobi_avo_(instant|hourly|daily|weekly|monthly|yearly|annual)-\d{6,8}\.(parquet|zip|csv|txt)$
    # buckets: daily
    split_parquet: month    
    # expected: 24
  fidas: 
    pattern: fidas-\d{10}.parquet
    buckets: daily
    split_parquet: month
    expected: 24
  hmp110-ae31:
    pattern: hmp110-ae31-\d{10}.(zip|dat)
    buckets: daily
    split_parquet: month
    expected: 24
  hmp110-inlet:
    pattern: hmp110-inlet-\d{10}.(zip|dat)
    buckets: daily
    split_parquet: month
    expected: 24
  hmp110-lab:
    pattern: hmp110-lab-\d{10}.(zip|dat)
    buckets: daily
    split_parquet: month
    expected: 24

  level2:
    station: nrb
    datetime_column: dtm
    timezone: UTC
    valid_flag_value: 0
    accept_null_flags: true
    parquet_compression: zstd
    output:
      hourly: true
      daily: true
    flags:
      mode: per_column_prefix
      prefix: f_
    aggregation:
      hourly:
        default: mean
        every: 1h
        label: left
        closed: left
      daily:
        default: mean
        every: 1d
        label: left
        closed: left
    instruments:
      "49i":
        columns:
          - O3
      ae31:
        columns:
          - UV370
          - B470
          - G520
          - Y590
          - R660
          - IR880
          - IR950
      fidas:
        columns:
          - PM1
          - PM2.5
          - PM4
          - PM10

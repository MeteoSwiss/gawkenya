nrb-aq:
  root: /product_data/data/pay/Kenya/NRB
  logging: mch-nrb.log
  branches:
    incoming: incoming
    archive: archive
    issues: incoming_with_issues
    logs: logs    
  file_name: file_coverage_nrb_aq.json
  folders:
    - "49i"
    - ae31
    - aurora3000
    - avo
    - fidas
    - hmp110-ae31
    - hmp110-inlet
    - hmp110-lab
  "49i": 
    pattern: 49i-\d{12}.(zip|dat)
    header: pcdate pctime time date flags o3 hio3 cellai cellbi bncht lmpt o3lt flowa flowb pres
    buckets: daily
    split_parquet: month    
    expected: 24
  ae31:
    pattern: (?i)ae31[_-]\d{10}\.(csv|zip)  # (ae31-\d{10}.(zip|csv))|(AE31_\d{10}\.csv)
    buckets: daily
    split_parquet: month    
    expected: 24
  aurora3000:
    pattern: aurora3000-\d{10}.(zip|csv)
    buckets: daily
    split_parquet: month
    expected: 24
  avo:
    pattern: not-yet-implemented
    buckets: daily
    expected: 24
  fidas: 
    pattern: fidas-\d{10}.parquet
    buckets: daily
    split_parquet: month
    expected: 24
  hmp110-ae31:
    pattern: hmp110-ae31-\d{10}.(zip|dat)
    buckets: daily
    split_parquet: month
    expected: 24
  hmp110-inlet:
    pattern: hmp110-inlet-\d{10}.(zip|dat)
    buckets: daily
    split_parquet: month
    expected: 24
  hmp110-lab:
    pattern: hmp110-lab-\d{10}.(zip|dat)
    buckets: daily
    split_parquet: month
    expected: 24

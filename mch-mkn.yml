# file organization depends on <buckets>.
# if buckets==daily: <root>/<middle>/<folders>/<yyyy>/<mm>/<dd>
# if buckets==monthly: <root>/<middle>/<folders>/<yyyy>/<mm>
root: /product_data/data/pay/Kenya/MKN/
logging: mch-mkn.log
branches:
  incoming: incoming
  archive: archive
  issues: incoming_with_issues
  logs: logs
folders:
  - ae33  #/data
  - fidas
  - meteo
  - 49c
  - 49i
  - g2401
  - ne300
  - hmp110-ae33
  - hmp110-inlet
ae33: 
  pattern: ae33-\d{12}.(zip|dat)
  buckets: daily
  split_parquet: month
  expected: 144
fidas: 
  pattern: fidas-\d{10}.parquet
  buckets: daily
  split_parquet: month
  expected: 24
meteo: 
  pattern: VRXA00.\d{12}
  buckets: daily
  split_parquet: month
  expected: 144
49c: 
  pattern: (?i)^49c-\d{10}\.(zip|dat)$
  # header: pcdate pctime time date o3 flags cellai cellbi bncht lmpt o3lt flowa flowb pres
  buckets: daily
  split_parquet: month
  expected: 24
49i: 
  pattern: (?i)^49i-\d{10}\.(zip|dat)$
  # header: pcdate pctime time date flags o3 hio3 cellai cellbi bncht lmpt o3lt flowa flowb pres
  buckets: daily
  split_parquet: month
  expected: 24
g2401: 
  pattern: CFKADS2320-\d{8}-\d{6}Z-DataLog_User_Sync.zip
  buckets: daily
  split_parquet: month
  expected: 24
ne300:
  pattern: ne300-\d{12}.(zip|dat)
  buckets: daily
  split_parquet: month
  expected: 144
hmp110-ae33:
  pattern: hmp110-ae33-\d{10}.(zip|dat)
  buckets: daily
  split_parquet: month
  expected: 24
hmp110-inlet:
  pattern: hmp110-inlet-\d{10}.(zip|dat)
  buckets: daily
  split_parquet: month
  expected: 24

level2:
  station: mkn
  datetime_column: dtm
  timezone: UTC
  valid_flag_value: 0
  accept_null_flags: true
  parquet_compression: zstd
  output:
    hourly: true
    daily: true
  flags:
    mode: per_column_prefix
    prefix: f_
  aggregation:
    hourly:
      default: mean
      every: 1h
      label: left
      closed: left
    daily:
      default: mean
      every: 1d
      label: left
      closed: left
  instruments:
    tei49c:
      columns:
        - o3
    tei49i:
      columns:
        - o3
        - flowa
        - flowb
        - pres
    ae33/data:
      source_parquet: ae33
      columns:
        - BC1
        - BC2
        - BC3
        - BC4
        - BC5
        - BC6
    fidas:
      columns:
        - "60"
        - "61"
        - "62"
        - "63"
        - "64"
